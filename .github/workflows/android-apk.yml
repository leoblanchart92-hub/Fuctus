name: android-apk

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-apk:
    name: Build release APK
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffolding (not committed — zero binaries in git)
        run: flutter create --platforms=android --org com.jarvisai --project-name jarvis_ai .

      - name: Patch Android manifest (permissions, label)
        run: python3 tool/ci/patch_android.py

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-ai-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: APK summary
        run: |
          ls -lh build/app/outputs/flutter-apk/
          echo "SHA256: $(sha256sum build/app/outputs/flutter-apk/app-release.apk)"
