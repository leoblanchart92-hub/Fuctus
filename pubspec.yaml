name: jarvis_ai
description: "JARVIS AI — Just A Rather Very Intelligent System. Assistant personnel Android: androïde 3D procédural, IA conversationnelle (Claude), voix naturelle, mémoire persistante et HUD futuriste."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # IA & réseau
  http: ^1.2.1

  # Voix
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2

  # Mémoire persistante
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4

  # Réglages & sécurité
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Permissions
  permission_handler: ^11.3.1

  # État
  provider: ^6.1.2

  # UI
  flutter_animate: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Aucun asset binaire : l'androïde et le HUD sont 100% procéduraux.
